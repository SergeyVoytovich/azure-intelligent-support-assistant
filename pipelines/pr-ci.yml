trigger:
  branches:
    include:
      - dev
      - main

pr:
  autoCancel: true
  branches:
    include:
      - dev
      - main

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release

steps:
  - task: UseDotNet@2
    displayName: Use .NET 10
    inputs:
      packageType: sdk
      version: 10.0.x

  - task: NodeTool@0
    displayName: Use Node 24
    inputs:
      versionSpec: 24.x

  - script: dotnet restore src/SupportAssistant.slnx
    displayName: Restore .NET

  - script: >
      dotnet build
      src/SupportAssistant.slnx
      --configuration $(buildConfiguration)
      --no-restore
      -warnaserror
    displayName: Build .NET

  - script: >
      dotnet test
      src/SupportAssistant.slnx
      --configuration $(buildConfiguration)
      --no-build
      --logger trx
      --collect:"XPlat Code Coverage"
    displayName: Test .NET

  - script: npm ci
    displayName: Install frontend dependencies
    workingDirectory: src/SupportAssistant.Web

  - script: npm run build
    displayName: Build frontend
    workingDirectory: src/SupportAssistant.Web

  - script: npm test -- --run
    displayName: Test frontend
    workingDirectory: src/SupportAssistant.Web