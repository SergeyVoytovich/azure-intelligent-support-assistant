trigger:
  branches:
    include:
      - dev
      - main

pr:
  autoCancel: true
  branches:
    include:
      - dev
      - main

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  azureServiceConnection: sc-isa-dev-wif
  functionAppName: func-isa-dev-uxfdhanjmza7m
  resourceGroupName: rg-isa-dev-uxfdhanjmza7m
  staticWebAppName: swa-isa-dev-uxfdhanjmza7m
  apiBaseUrl: https://func-isa-dev-uxfdhanjmza7m.azurewebsites.net

steps:
  - task: UseDotNet@2
    displayName: Use .NET 10
    inputs:
      packageType: sdk
      version: 10.0.x

  - task: NodeTool@0
    displayName: Use Node 24
    inputs:
      versionSpec: 24.x

  # -------------------------
  # Restore dependencies
  # -------------------------

  - script: dotnet restore src/SupportAssistant.slnx
    displayName: Restore .NET

  # Solution restore does not invoke the Functions SDK post-restore hook (AZFW0108).
  - script: dotnet restore src/SupportAssistant.Api/SupportAssistant.Api.csproj -p:Configuration=$(buildConfiguration)
    displayName: Restore Azure Functions extensions

  - script: npm ci
    displayName: Install frontend dependencies
    workingDirectory: src/SupportAssistant.Web

  # -------------------------
  # Security scans
  # -------------------------

  - script: |
      dotnet list src/SupportAssistant.slnx package --vulnerable --include-transitive
    displayName: Scan .NET dependencies

  - script: npm audit --audit-level=high
    displayName: Scan frontend dependencies
    workingDirectory: src/SupportAssistant.Web

  - script: |
      docker run --rm \
        -v "$(Build.SourcesDirectory):/repo" \
        zricethezav/gitleaks:latest \
        detect \
        --source=/repo \
        --no-git \
        --verbose \
        --redact=100
    displayName: Gitleaks secret scan

  - script: |
      docker run --rm \
        -v "$(Build.SourcesDirectory):/repo" \
        aquasec/trivy:latest \
        fs \
        --severity HIGH,CRITICAL \
        --exit-code 1 \
        --no-progress \
        --secret-config /repo/trivy-secret.yaml \
        /repo
    displayName: Trivy filesystem scan

  # -------------------------
  # Bicep validation
  # -------------------------

  - script: |
      az bicep install
      az bicep build --file infra/main.bicep
      az bicep build --file infra/web.bicep --stdout > /dev/null
    displayName: Validate Bicep

  # -------------------------
  # Backend build and tests
  # -------------------------

  - script: >
      dotnet build
      src/SupportAssistant.slnx
      --configuration $(buildConfiguration)
      --no-restore
      -warnaserror
    displayName: Build .NET

  - script: >
      dotnet test
      src/SupportAssistant.UnitTests/SupportAssistant.UnitTests.csproj
      --configuration $(buildConfiguration)
      --no-build
      --logger trx
      --collect:"XPlat Code Coverage"
    displayName: Test .NET unit tests

  - script: >
      dotnet test
      src/SupportAssistant.ArchitectureTests/SupportAssistant.ArchitectureTests.csproj
      --configuration $(buildConfiguration)
      --no-build
      --logger trx
      --collect:"XPlat Code Coverage"
    displayName: Test .NET architecture

  # Live API and Azure checks run separately via integration-tests.yml.

  # -------------------------
  # Frontend build and tests
  # -------------------------

  - script: npm run build
    displayName: Build frontend
    workingDirectory: src/SupportAssistant.Web
    env:
      VITE_API_BASE_URL: '$(apiBaseUrl)'

  - script: npm test -- --run
    displayName: Test frontend
    workingDirectory: src/SupportAssistant.Web

  # -------------------------
  # Test reports
  # -------------------------

  - task: PublishTestResults@2
    displayName: Publish .NET test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: '**/*.trx'
      failTaskOnFailedTests: true

  - task: PublishCodeCoverageResults@2
    displayName: Publish .NET code coverage
    condition: succeededOrFailed()
    inputs:
      summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/coverage.cobertura.xml'

  # -------------------------
  # Build artifacts
  # -------------------------

  - script: >
      dotnet publish
      src/SupportAssistant.Api/SupportAssistant.Api.csproj
      --configuration $(buildConfiguration)
      --output $(Build.ArtifactStagingDirectory)/api
      --no-build
    displayName: Publish backend

  - task: PublishPipelineArtifact@1
    displayName: Publish backend artifact
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/api'
      artifact: api

  - task: PublishPipelineArtifact@1
    displayName: Publish frontend artifact
    inputs:
      targetPath: 'src/SupportAssistant.Web/dist'
      artifact: web

  # -------------------------
  # Deploy backend to Azure
  # -------------------------

  - task: AzureFunctionApp@2
    displayName: Deploy backend to Azure Functions
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
    inputs:
      azureSubscription: '$(azureServiceConnection)'
      appType: functionAppLinux
      isFlexConsumption: true
      appName: '$(functionAppName)'
      package: '$(Build.ArtifactStagingDirectory)/api'

  # -------------------------
  # Deploy the prebuilt frontend (dev only)
  # -------------------------

  - task: AzureCLI@2
    displayName: Prepare Static Web App and API CORS
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
    inputs:
      azureSubscription: '$(azureServiceConnection)'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        az deployment group create \
          --resource-group "$(resourceGroupName)" \
          --name isa-web-dev \
          --template-file infra/web.bicep \
          --parameters staticWebAppName="$(staticWebAppName)" environment=dev \
          --only-show-errors --output none

        webHost=$(az staticwebapp show \
          --resource-group "$(resourceGroupName)" \
          --name "$(staticWebAppName)" --query defaultHostname --output tsv)
        if [ -z "$webHost" ] || [ "$webHost" = "None" ]; then
          echo "Static Web App hostname is missing."
          exit 1
        fi
        az functionapp cors add \
          --resource-group "$(resourceGroupName)" \
          --name "$(functionAppName)" \
          --allowed-origins "https://$webHost" \
          --only-show-errors --output none

        deploymentToken=$(az staticwebapp secrets list \
          --resource-group "$(resourceGroupName)" \
          --name "$(staticWebAppName)" --query properties.apiKey --output tsv)
        if [ -z "$deploymentToken" ] || [ "$deploymentToken" = "None" ]; then
          echo "Static Web App deployment token is missing."
          exit 1
        fi
        echo "##vso[task.setvariable variable=staticWebAppDeploymentToken;issecret=true]$deploymentToken"

  - task: AzureStaticWebApp@0
    displayName: Deploy frontend to Azure Static Web Apps
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
    inputs:
      app_location: src/SupportAssistant.Web/dist
      api_location: ''
      output_location: ''
      skip_app_build: true
      skip_api_build: true
      production_branch: dev
      azure_static_web_apps_api_token: '$(staticWebAppDeploymentToken)'